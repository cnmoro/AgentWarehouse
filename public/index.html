<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Terminal</title>
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div id="app">
    <nav id="rail" aria-label="Collapsed sidebar">
      <button id="expand" class="icon-btn" title="Show terminals" aria-label="Show terminals">☰</button>
      <button class="icon-btn new-tab" title="New terminal" aria-label="New terminal">+</button>
      <span class="conn" role="status" aria-label="Disconnected" title="Disconnected"></span>
    </nav>
    <aside id="sidebar" aria-label="Terminals">
      <div class="sidebar-head">
        <div class="brand"><span class="brand-mark" aria-hidden="true">&gt;_</span> Terminals</div>
        <div class="head-actions">
          <button class="icon-btn new-tab" title="New terminal (opens in the current tab's folder)" aria-label="New terminal">+</button>
          <button id="collapse" class="icon-btn" title="Hide sidebar" aria-label="Hide sidebar">«</button>
        </div>
      </div>
      <ul id="tabs" role="tablist" aria-orientation="vertical"
          title="Ctrl+Shift+E to get here. Arrow keys to move, F2 to rename, Delete to close, Esc back to the terminal"></ul>
      <div class="sidebar-foot">
        <span class="conn" role="status" aria-label="Disconnected" title="Disconnected"></span>
        <span id="who" class="who"></span>
        <span class="font-size" role="group" aria-label="Font size">
          <button id="font-down" class="link-btn" title="Smaller text (Ctrl+Shift+−)" aria-label="Smaller text">A−</button>
          <button id="font-up" class="link-btn" title="Larger text (Ctrl+Shift++)" aria-label="Larger text">A+</button>
        </span>
        <button id="logout" class="link-btn">Sign out</button>
      </div>
    </aside>
    <div id="backdrop" hidden></div>
    <main id="main">
      <div id="terms"></div>
      <div id="empty" class="empty" hidden>
        <div>
          <p>No terminals open.</p>
          <button class="primary new-tab">New terminal</button>
        </div>
      </div>
      <div id="banner" class="banner" role="alert" hidden>Connection lost. Reconnecting… Typing is disabled until then.</div>
      <div id="toast" class="banner toast" role="status" hidden></div>
    </main>
  </div>
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/vendor/addon-web-links.js"></script>
  <script src="/vendor/addon-webgl.js"></script>
  <script src="/vendor/addon-unicode11.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
