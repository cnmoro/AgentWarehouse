<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Agent Warehouse</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e1116'/%3E%3Cpath d='M8 10l6 6-6 6' stroke='%235fb3ff' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M16 22h8' stroke='%23d6dde6' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div id="app">
    <nav id="rail" aria-label="Collapsed sidebar">
      <button id="expand" class="icon-btn" title="Show terminals" aria-label="Show terminals">☰</button>
      <button class="icon-btn ssh-btn" title="SSH connections" aria-label="SSH connections" hidden><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M3.5 3A1.5 1.5 0 0 0 2 4.5v11A1.5 1.5 0 0 0 3.5 17h13a1.5 1.5 0 0 0 1.5-1.5v-11A1.5 1.5 0 0 0 16.5 3zm.5 1.5h12v1.7H4zM5.2 8.2l3.3 2.3-3.3 2.3-.8-1.2 1.6-1.1-1.6-1.1zM9.5 12.6h4v1.4h-4z"/></svg></button>
      <button class="icon-btn vnc-btn" title="Desktop (VNC)" aria-label="Desktop" hidden><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M2 3.5A1.5 1.5 0 0 1 3.5 2h13A1.5 1.5 0 0 1 18 3.5v9a1.5 1.5 0 0 1-1.5 1.5H11v2h3v1.5H6V16h3v-2H3.5A1.5 1.5 0 0 1 2 12.5zm1.5 0v9h13v-9z"/></svg></button>
      <button class="icon-btn files-btn" title="Files (Ctrl+Shift+F)" aria-label="Files" hidden><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M2 5.5A1.5 1.5 0 0 1 3.5 4h4l1.6 1.8h7.4A1.5 1.5 0 0 1 18 7.3v7.2a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 2 14.5z"/></svg></button>
      <button class="icon-btn new-tab" title="New terminal" aria-label="New terminal">+</button>
      <span class="conn" role="status" aria-label="Disconnected" title="Disconnected"></span>
    </nav>
    <aside id="sidebar" aria-label="Terminals">
      <div class="sidebar-head">
        <div class="brand"><span class="brand-mark" aria-hidden="true">&gt;_</span> Terminals</div>
        <div class="head-actions">
          <button class="icon-btn new-tab" title="New terminal (opens in the current tab's folder)" aria-label="New terminal">+</button>
          <button id="collapse" class="icon-btn" title="Hide sidebar" aria-label="Hide sidebar">«</button>
        </div>
      </div>
      <div class="head-tools-wrap">
      <div class="head-tools">
          <button id="search-btn" class="head-tool" title="Find a session (Ctrl+Shift+K)" aria-label="Find a session" aria-expanded="false"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8.5 2a6.5 6.5 0 0 1 5.2 10.4l4.2 4.2-1.1 1.1-4.2-4.2A6.5 6.5 0 1 1 8.5 2zm0 1.5a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg><span>Find</span></button>
          <button class="head-tool ssh-btn" title="SSH connections" aria-label="SSH connections" hidden><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M3.5 3A1.5 1.5 0 0 0 2 4.5v11A1.5 1.5 0 0 0 3.5 17h13a1.5 1.5 0 0 0 1.5-1.5v-11A1.5 1.5 0 0 0 16.5 3zm.5 1.5h12v1.7H4zM5.2 8.2l3.3 2.3-3.3 2.3-.8-1.2 1.6-1.1-1.6-1.1zM9.5 12.6h4v1.4h-4z"/></svg><span>SSH</span></button>
          <button class="head-tool vnc-btn" title="Desktop (VNC)" aria-label="Desktop" hidden><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M2 3.5A1.5 1.5 0 0 1 3.5 2h13A1.5 1.5 0 0 1 18 3.5v9a1.5 1.5 0 0 1-1.5 1.5H11v2h3v1.5H6V16h3v-2H3.5A1.5 1.5 0 0 1 2 12.5zm1.5 0v9h13v-9z"/></svg><span>Desktop</span></button>
          <button class="head-tool files-btn" title="Files (Ctrl+Shift+F)" aria-label="Files" hidden><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M2 5.5A1.5 1.5 0 0 1 3.5 4h4l1.6 1.8h7.4A1.5 1.5 0 0 1 18 7.3v7.2a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 2 14.5z"/></svg><span>Files</span></button>
      </div>
      </div>
      <div id="search" class="search" hidden>
        <input id="search-q" type="search" placeholder="Find a session…" aria-label="Find a session" autocomplete="off" spellcheck="false">
      </div>
      <ul id="tabs" role="tablist" aria-orientation="vertical"
          title="Ctrl+Shift+E to get here. Arrow keys to move, F2 to rename, Delete to close, Esc back to the terminal"></ul>
      <div class="sidebar-foot">
        <span class="conn" role="status" aria-label="Disconnected" title="Disconnected"></span>
        <span id="who" class="who"></span>
        <span class="font-size" role="group" aria-label="Font size">
          <button id="font-down" class="link-btn" title="Smaller text (Ctrl −)" aria-label="Smaller text">A−</button>
          <button id="font-up" class="link-btn" title="Larger text (Ctrl +)" aria-label="Larger text">A+</button>
        </span>
        <button id="logout" class="link-btn">Sign out</button>
      </div>
    </aside>
    <div id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Resize sidebar"
         tabindex="0" title="Drag to resize · double-click to reset"></div>
    <div id="backdrop" hidden></div>
    <main id="main">
      <div id="strip" class="strip" role="tablist" aria-label="Tabs of this session" hidden></div>
      <div id="terms"></div>
      <div id="keybar" role="toolbar" aria-label="Terminal keys">
        <button data-key="esc">Esc</button>
        <button data-key="tab">Tab</button>
        <button data-key="ctrl" aria-pressed="false">Ctrl</button>
        <button data-key="left" aria-label="Left">←</button>
        <button data-key="up" aria-label="Up">↑</button>
        <button data-key="down" aria-label="Down">↓</button>
        <button data-key="right" aria-label="Right">→</button>
        <button data-key="|">|</button>
        <button data-key="~">~</button>
        <button data-key="/">/</button>
      </div>
      <div id="empty" class="empty" hidden>
        <div>
          <p>No terminals open.</p>
          <button class="primary new-tab">New terminal</button>
        </div>
      </div>
      <button id="histpill" class="histpill" hidden></button>
      <section id="history" class="history" hidden aria-label="Terminal history">
        <div class="history-bar">
          <span class="history-title">History</span>
          <input id="hist-q" type="search" placeholder="Search · Enter older · Shift+Enter newer" aria-label="Search history" autocomplete="off" spellcheck="false">
          <span id="hist-status" class="history-status" role="status"></span>
          <button id="hist-bottom" class="link-btn" title="Jump to the latest output (End)">Latest</button>
          <button id="hist-close" class="icon-btn" title="Close history (Esc)" aria-label="Close history">✕</button>
        </div>
        <div id="hist-scroll" class="history-scroll" tabindex="0">
          <div id="hist-spacer"></div>
          <div id="hist-rows" class="history-rows"></div>
        </div>
      </section>
      <div id="banner" class="banner" role="alert" hidden>Connection lost. Reconnecting… Typing is disabled until then.
        <button id="retry-now" class="banner-btn">Retry now</button></div>
      <div id="toast" class="banner toast" role="status" hidden></div>
      <div id="splitters"></div>
      <div id="panebars"></div>
      <div id="dropzone" class="dropzone" hidden><div class="dz-hl"></div></div>
      <section id="files" class="files" hidden aria-label="Files"></section>
      <section id="vnc" class="vnc" hidden aria-label="Desktop"></section>
      <section id="ssh" class="ssh" hidden aria-label="SSH connections"></section>
    </main>
  </div>
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/vendor/addon-web-links.js"></script>
  <script src="/vendor/addon-webgl.js"></script>
  <script src="/vendor/addon-unicode11.js"></script>
  <script src="/static/clamp.js"></script>
  <script src="/static/app.js"></script>
  <script src="/vendor/marked.js"></script>
  <script src="/vendor/purify.js"></script>
  <script src="/static/gitdiff.js"></script>
  <script src="/static/files.js"></script>
  <script src="/static/vnc.js"></script>
  <script src="/static/ssh.js"></script>
</body>
</html>
