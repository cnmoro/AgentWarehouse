<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Web Terminal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e1116'/%3E%3Cpath d='M8 10l6 6-6 6' stroke='%235fb3ff' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M16 22h8' stroke='%23d6dde6' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div id="app">
    <nav id="rail" aria-label="Collapsed sidebar">
      <button id="expand" class="icon-btn" title="Show terminals" aria-label="Show terminals">☰</button>
      <button class="icon-btn new-tab" title="New terminal" aria-label="New terminal">+</button>
      <span class="conn" role="status" aria-label="Disconnected" title="Disconnected"></span>
    </nav>
    <aside id="sidebar" aria-label="Terminals">
      <div class="sidebar-head">
        <div class="brand"><span class="brand-mark" aria-hidden="true">&gt;_</span> Terminals</div>
        <div class="head-actions">
          <button class="icon-btn new-tab" title="New terminal (opens in the current tab's folder)" aria-label="New terminal">+</button>
          <button id="collapse" class="icon-btn" title="Hide sidebar" aria-label="Hide sidebar">«</button>
        </div>
      </div>
      <ul id="tabs" role="tablist" aria-orientation="vertical"
          title="Ctrl+Shift+E to get here. Arrow keys to move, F2 to rename, Delete to close, Esc back to the terminal"></ul>
      <div class="sidebar-foot">
        <span class="conn" role="status" aria-label="Disconnected" title="Disconnected"></span>
        <span id="who" class="who"></span>
        <span class="font-size" role="group" aria-label="Font size">
          <button id="font-down" class="link-btn" title="Smaller text (Ctrl −)" aria-label="Smaller text">A−</button>
          <button id="font-up" class="link-btn" title="Larger text (Ctrl +)" aria-label="Larger text">A+</button>
        </span>
        <button id="logout" class="link-btn">Sign out</button>
      </div>
    </aside>
    <div id="backdrop" hidden></div>
    <main id="main">
      <div id="terms"></div>
      <div id="keybar" role="toolbar" aria-label="Terminal keys">
        <button data-key="esc">Esc</button>
        <button data-key="tab">Tab</button>
        <button data-key="ctrl" aria-pressed="false">Ctrl</button>
        <button data-key="left" aria-label="Left">←</button>
        <button data-key="up" aria-label="Up">↑</button>
        <button data-key="down" aria-label="Down">↓</button>
        <button data-key="right" aria-label="Right">→</button>
        <button data-key="|">|</button>
        <button data-key="~">~</button>
        <button data-key="/">/</button>
      </div>
      <div id="empty" class="empty" hidden>
        <div>
          <p>No terminals open.</p>
          <button class="primary new-tab">New terminal</button>
        </div>
      </div>
      <button id="histpill" class="histpill" hidden></button>
      <section id="history" class="history" hidden aria-label="Terminal history">
        <div class="history-bar">
          <span class="history-title">History</span>
          <input id="hist-q" type="search" placeholder="Search · Enter older · Shift+Enter newer" aria-label="Search history" autocomplete="off" spellcheck="false">
          <span id="hist-status" class="history-status" role="status"></span>
          <button id="hist-bottom" class="link-btn" title="Jump to the latest output (End)">Latest</button>
          <button id="hist-close" class="icon-btn" title="Close history (Esc)" aria-label="Close history">✕</button>
        </div>
        <div id="hist-scroll" class="history-scroll" tabindex="0">
          <div id="hist-spacer"></div>
          <div id="hist-rows" class="history-rows"></div>
        </div>
      </section>
      <div id="banner" class="banner" role="alert" hidden>Connection lost. Reconnecting… Typing is disabled until then.</div>
      <div id="toast" class="banner toast" role="status" hidden></div>
    </main>
  </div>
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/vendor/addon-web-links.js"></script>
  <script src="/vendor/addon-webgl.js"></script>
  <script src="/vendor/addon-unicode11.js"></script>
  <script src="/static/clamp.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
