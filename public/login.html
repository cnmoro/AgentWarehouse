<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Agent Warehouse</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e1116'/%3E%3Cpath d='M8 10l6 6-6 6' stroke='%235fb3ff' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M16 22h8' stroke='%23d6dde6' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-page">
  <form id="login" class="login-card" autocomplete="on">
    <div class="brand"><span class="brand-mark">&gt;_</span> Web Terminal</div>
    <label>Email or username
      <input type="text" name="email" autocapitalize="none" spellcheck="false" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <p id="error" class="error" role="alert" hidden></p>
    <button type="submit">Sign in</button>
  </form>
  <script src="/static/login.js"></script>
</body>
</html>
